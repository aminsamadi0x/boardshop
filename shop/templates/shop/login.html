{% extends 'shop/base.html' %}
{% block title %}ورود - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-custom p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-user-circle fa-4x" style="color: var(--primary-blue-light);"></i>
                    <h4 class="mt-2 fw-bold">ورود به حساب کاربری</h4>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">نام کاربری</label>
                        <input type="text" name="username" class="form-control rounded-pill" placeholder="نام کاربری خود را وارد کنید" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">رمز عبور</label>
                        <input type="password" name="password" class="form-control rounded-pill" placeholder="رمز عبور خود را وارد کنید" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary-custom w-100">
                        <i class="fas fa-sign-in-alt me-2"></i> ورود
                    </button>
                </form>
                
                <hr>
                
                <div class="text-center">
                    <p class="mb-2">حساب کاربری ندارید؟</p>
                    <a href="{% url 'shop:register' %}" class="btn btn-outline-custom w-100">
                        <i class="fas fa-user-plus me-2"></i> ثبت نام
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
