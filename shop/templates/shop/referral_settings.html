{% extends 'shop/base.html' %}

{% block title %}تنظیمات دعوت - {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h3 class="section-title">تنظیمات سیستم دعوت</h3>
    
    <div class="card-custom p-4">
        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if settings.is_active %}checked{% endif %}>
                    <label class="form-check-label fw-bold" for="is_active">فعال بودن سیستم دعوت</label>
                </div>
            </div>
            
            <hr>
            
            <h5 class="fw-bold">جایزه معرف</h5>
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">نوع تخفیف معرف</label>
                    <select name="referrer_discount_type" class="form-control rounded-pill">
                        <option value="percentage" {% if settings.referrer_discount_type == 'percentage' %}selected{% endif %}>درصدی</option>
                        <option value="fixed" {% if settings.referrer_discount_type == 'fixed' %}selected{% endif %}>ثابت</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">مقدار تخفیف معرف</label>
                    <input type="number" name="referrer_discount_amount" class="form-control rounded-pill" value="{{ settings.referrer_discount_amount }}" step="0.01">
                </div>
                <div class="col-md-12">
                    <label class="form-label">اعتبار معرف (تومان)</label>
                    <input type="number" name="referrer_credit_amount" class="form-control rounded-pill" value="{{ settings.referrer_credit_amount }}">
                </div>
            </div>
            
            <hr>
            
            <h5 class="fw-bold">جایزه کاربر جدید</h5>
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">نوع تخفیف کاربر جدید</label>
                    <select name="new_user_discount_type" class="form-control rounded-pill">
                        <option value="percentage" {% if settings.new_user_discount_type == 'percentage' %}selected{% endif %}>درصدی</option>
                        <option value="fixed" {% if settings.new_user_discount_type == 'fixed' %}selected{% endif %}>ثابت</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">مقدار تخفیف کاربر جدید</label>
                    <input type="number" name="new_user_discount_amount" class="form-control rounded-pill" value="{{ settings.new_user_discount_amount }}" step="0.01">
                </div>
                <div class="col-md-12">
                    <label class="form-label">مدت اعتبار کد تخفیف (روز)</label>
                    <input type="number" name="discount_expiry_days" class="form-control rounded-pill" value="{{ settings.discount_expiry_days }}">
                </div>
            </div>
            
            <hr>
            
            <button type="submit" class="btn btn-primary-custom">
                <i class="fas fa-save me-2"></i> ذخیره تنظیمات
            </button>
        </form>
    </div>
</div>
{% endblock %}
